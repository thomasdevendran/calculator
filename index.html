<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    .calculator {
      width: min(92vw, 340px);
      background: #1f1f1f;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    #display {
      width: 100%;
      height: 76px;
      border: 0;
      border-radius: 10px;
      margin-bottom: 14px;
      padding: 12px;
      text-align: right;
      font-size: 2rem;
      background: #fff;
      color: #111;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 18px 8px;
      font-size: 1.2rem;
      cursor: pointer;
      background: #e8e8e8;
    }
    button:hover { filter: brightness(.92); }
    .operator { background: #ffb347; }
    .clear { background: #ef6b6b; color: white; }
    .equals { background: #67c587; color: white; grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator">
    <input id="display" type="text" value="0" readonly aria-label="Calculator display" />
    <div class="keys">
      <button class="clear" data-action="clear">C</button>
      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    let expression = '';

    function updateDisplay() {
      display.value = expression || '0';
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      if (button.dataset.action === 'clear') {
        expression = '';
        updateDisplay();
        return;
      }

      if (button.dataset.action === 'equals') {
        try {
          if (!expression) return;
          const safeExpression = expression.replace(/[^0-9+\-*/().]/g, '');
          const result = Function(`"use strict"; return (${safeExpression})`)();
          expression = Number.isFinite(result) ? String(result) : 'Error';
        } catch {
          expression = 'Error';
        }
        updateDisplay();
        return;
      }

      if (expression === 'Error') expression = '';
      expression += button.dataset.value;
      updateDisplay();
    });
  </script>
</body>
</html>
